version: "3.9"

# Pin image digests as well as version tags for production deployments.
services:
  db:
    image: mariadb:11.4.5
    container_name: dvwa-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DVWA_DB_NAME:?Set DVWA_DB_NAME in .env}
      MYSQL_USER: ${DVWA_DB_USER:?Set DVWA_DB_USER in .env}
      MYSQL_PASSWORD: ${DVWA_DB_PASSWORD:?Set DVWA_DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - dvwa_lab

  dvwa:
    image: vulnerables/web-dvwa:1.10.0
    container_name: dvwa
    restart: unless-stopped
    environment:
      DB_SERVER: db
      DB_USER: ${DVWA_DB_USER:?Set DVWA_DB_USER in .env}
      DB_PASSWORD: ${DVWA_DB_PASSWORD:?Set DVWA_DB_PASSWORD in .env}
      DB_DATABASE: ${DVWA_DB_NAME:?Set DVWA_DB_NAME in .env}
      DVWA_DIFFICULTY: ${DVWA_DIFFICULTY:-impossible}
    depends_on:
      - db
    networks:
      - dvwa_lab

  nginx:
    image: nginx:1.26.3
    container_name: dvwa-nginx
    restart: unless-stopped
    depends_on:
      - dvwa
    ports:
      - "127.0.0.1:443:443"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - dvwa_lab

volumes:
  db_data:

networks:
  dvwa_lab:
    driver: bridge
