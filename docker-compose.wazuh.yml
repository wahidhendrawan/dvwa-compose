# Host-level access: see "Wazuh SIEM Integration" in README.md before enabling.
services:
  wazuh-agent:
    # Docker Hub publishes wazuh-agent images from 4.13 on; keep the agent no newer than your manager.
    image: wazuh/wazuh-agent:4.14.10@sha256:c30f8cdf7e535674c9f9881aa2824e5e94f7e3f66dd2b90eaf36c4ad155c6526
    container_name: dvwa-wazuh-agent
    restart: unless-stopped
    depends_on:
      - dvwa
    environment:
      # Variable names read by the wazuh/wazuh-agent image's init script.
      WAZUH_MANAGER_SERVER: ${WAZUH_MANAGER:-wazuh.manager.local}
      WAZUH_AGENT_NAME: dvwa-agent
      WAZUH_AGENT_GROUP: dvwa
    volumes:
      - wazuh_data:/var/ossec/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - DAC_OVERRIDE
      - NET_ADMIN
      - NET_RAW
    pid: "host"
    networks:
      - dvwa_lab

volumes:
  wazuh_data:

networks:
  dvwa_lab:
    driver: bridge
